server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compresión ---
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript image/svg+xml font/woff2;
    gzip_min_length 512;

    # --- Cabeceras de seguridad ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Sin dependencias externas: CSP restrictiva a 'self'
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; base-uri 'self'; frame-ancestors 'self';" always;

    # --- Cache de assets estáticos (fuentes) ---
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Página de error simple (usa el mismo index para SPA-like fallback si algún día lo necesitas)
    error_page 404 /index.html;
}
